<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080A" />
    <title>NGS Partner</title>
    <meta name="description" content="NGS Partner — picking & delivery app for NGS Store staff." />
    <link rel="icon" type="image/svg+xml" href="/logo-partner.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-partner-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-partner.png" />

    <!-- Installable PWA. iOS only allows Web Push when the app is added to the
         Home Screen AND launches in standalone mode — which needs these tags +
         the manifest below. Without them "Add to Home Screen" opens a plain
         Safari bookmark and push stays blocked. -->
    <link rel="manifest" href="/manifest-partner.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="NGS Partner" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main-partner.jsx"></script>
  </body>
</html>
