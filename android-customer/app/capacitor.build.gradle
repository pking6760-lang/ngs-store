// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
// EXCEPT: the ML Kit barcode scanner is deliberately left out of the CUSTOMER
// app. Nothing in the customer storefront scans anything, and the plugin costs
// ~5 MB of native library in every download. If a `cap sync` ever puts it back,
// remove it again (and from capacitor.plugins.json + capacitor.settings.gradle).

android {
  compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
  }
}

apply from: "../capacitor-cordova-android-plugins/cordova.variables.gradle"
dependencies {
    implementation project(':capacitor-app')
    implementation project(':capacitor-geolocation')
    implementation project(':capacitor-push-notifications')
    implementation project(':capacitor-native-biometric')
    implementation project(':capacitor-filesystem')
    implementation project(':capacitor-community-file-opener')

}


if (hasProperty('postBuildExtras')) {
  postBuildExtras()
}
