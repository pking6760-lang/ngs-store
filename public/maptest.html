<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGS Map Test</title>
  <link rel="stylesheet" href="/lib/leaflet.css" />
  <style>
    html, body { margin: 0; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 320px; background: #dfe6e1; }
    #log { padding: 12px; font-size: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="log">Loading…</div>
  <script src="/lib/leaflet.js"></script>
  <script>
    var log = document.getElementById("log");
    function say(m) { log.textContent += "\n" + m; }
    try {
      if (typeof L === "undefined") { log.textContent = "❌ Leaflet did not load"; }
      else {
        log.textContent = "✅ Leaflet loaded";
        var shop = { lat: 28.497071, lng: 77.161094 };
        var home = { lat: 28.49641, lng: 77.161978 };
        var map = L.map("map", { zoomControl: true, attributionControl: false });
        var provider = location.hash === "#osm"
          ? "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
          : "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png";
        say("provider: " + (location.hash === "#osm" ? "OSM" : "Carto") + " (add #osm to URL to test OSM)");
        var tiles = L.tileLayer(provider, { maxZoom: 19, subdomains: "abcd" });
        var loaded = 0, errored = 0;
        tiles.on("tileload", function () { loaded++; if (loaded <= 3 || loaded % 5 === 0) say("tiles loaded: " + loaded); });
        tiles.on("tileerror", function () { errored++; say("tile ERROR #" + errored); });
        tiles.addTo(map);
        L.marker([shop.lat, shop.lng]).addTo(map);
        L.marker([home.lat, home.lng]).addTo(map);
        var line = L.polyline([[shop.lat, shop.lng], [home.lat, home.lng]], { color: "#0AA25F", weight: 5 }).addTo(map);
        map.fitBounds(line.getBounds().pad(0.45), { maxZoom: 16 });
        setTimeout(function () { map.invalidateSize(); say("zoom: " + map.getZoom()); }, 800);
      }
    } catch (e) { say("❌ error: " + (e && e.message)); }
  </script>
</body>
</html>
