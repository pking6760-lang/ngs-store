apply plugin: 'com.android.application'

// Release signing — keystore + passwords come from ../signing/keystore.properties
// (git-ignored). When absent (e.g. a plain debug build), builds fall back to the
// debug key so `assembleDebug` still works with no setup.
def ngsKsProps = new Properties()
def ngsKsFile = rootProject.file("../signing/keystore.properties")
if (ngsKsFile.exists()) { ngsKsProps.load(new FileInputStream(ngsKsFile)) }

android {
    namespace "com.ngsstore.admin"
    compileSdk rootProject.ext.compileSdkVersion
    lint { checkReleaseBuilds false; abortOnError false }
    defaultConfig {
        applicationId "com.ngsstore.partner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "2.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Ship only the processor types real phones use. The default build also
        // packs x86 and x86_64 builds of every native library — those exist for
        // desktop emulators, and they were 11 MB of a 26 MB download that every
        // customer pays for on every update.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (ngsKsFile.exists()) {
                storeFile file("../../signing/ngs-release.jks")
                storePassword ngsKsProps['storePassword']
                keyAlias ngsKsProps['keyAlias']
                keyPassword ngsKsProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig ngsKsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

// The barcode scanner keeps working; only the OFFLINE COPY of the model goes.
//
// @capacitor-mlkit/barcode-scanning pulls in com.google.mlkit:barcode-scanning,
// which bundles the decoder into the APK: libbarhopper_v3.so for two ABIs plus
// the .tflite models, about 8 MB of the partner app's 14 MB. But lib/scanner.js
// scans through the Google code scanner (BarcodeScanner.scan → GmsBarcodeScanning),
// whose module is delivered by Play Services on first use — it already calls
// isGoogleBarcodeScannerModuleAvailable() and installs it if missing. So the
// bundled copy was never the one doing the scanning.
//
// Swapped, not deleted. play-services-mlkit-barcode-scanning is Google's
// unbundled build of the SAME com.google.mlkit.vision.barcode.* classes the
// plugin imports and holds as a field, so nothing it references disappears —
// only the model does, and that arrives from Play Services instead.
configurations.all {
    exclude group: 'com.google.mlkit', module: 'barcode-scanning'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Needed to compile our own FirebaseMessagingService (the Capacitor push
    // plugin keeps firebase-messaging as a private 'implementation' dependency).
    implementation "com.google.firebase:firebase-messaging:23.3.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
